version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docyra-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/docyra
      - JWT_ACCESS_SECRET=docyra_jwt_access_secret_super_secure_key_12345
      - JWT_REFRESH_SECRET=docyra_jwt_refresh_secret_super_secure_key_12345
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - BCRYPT_SALT_ROUNDS=12
      - TOTP_ISSUER=Docyra
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4200,https://patient.docyra.app,https://portal.docyra.app
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - docyra-network

  mongo:
    image: mongo:7.0
    container_name: docyra-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - docyra-network

  mongo-express:
    image: mongo-express:latest
    container_name: docyra-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=password
    depends_on:
      - mongo
    networks:
      - docyra-network

networks:
  docyra-network:
    driver: bridge

volumes:
  mongo-data:
