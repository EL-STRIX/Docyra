version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docyra-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/docyra
      - JWT_ACCESS_SECRET=your_jwt_access_secret_key_min_32_characters_long_for_security
      - JWT_REFRESH_SECRET=your_jwt_refresh_secret_key_min_32_characters_long_for_security
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - BCRYPT_SALT_ROUNDS=12
      - CSRF_SECRET=your_csrf_secret_key_min_32_characters_long_for_security
      - TOTP_ISSUER=Docyra
      - EMAIL_FROM=no-reply@docyra.app
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4200
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules

  mongo:
    image: mongo:7.0
    container_name: docyra-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: docyra-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo

volumes:
  mongo-data:
