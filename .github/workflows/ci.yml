name: CI Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend-react, frontend-angular]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies (${{ matrix.app }})
        run: cd ${{ matrix.app }} && npm install

      - name: Lint (${{ matrix.app }})
        run: cd ${{ matrix.app }} && npm run lint --if-present

      - name: Security audit (${{ matrix.app }})
        run: cd ${{ matrix.app }} && npm audit --audit-level=high --if-present || true

  frontend-builds:
    runs-on: ubuntu-latest
    needs: lint-and-audit
    strategy:
      matrix:
        app: [frontend-react, frontend-angular]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies (${{ matrix.app }})
        run: cd ${{ matrix.app }} && npm install

      - name: Build (${{ matrix.app }})
        run: cd ${{ matrix.app }} && npm run build

  backend-tests:
    runs-on: ubuntu-latest
    needs: lint-and-audit
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Run Backend Test Suites
        run: cd backend && npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/docyra-test
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_32_chars_min
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_32_chars_min
