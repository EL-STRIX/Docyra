name: Docyra CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run linter
        working-directory: backend
        run: npm run lint

      - name: Run test suites with MongoDB Memory Server
        working-directory: backend
        run: npm test

      - name: Dependency security audit
        working-directory: backend
        run: npm audit --audit-level=high

  frontend-react-ci:
    name: Frontend React Patient App Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: frontend-react
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend-react
        run: npm run build

      - name: Dependency security audit
        working-directory: frontend-react
        run: npm audit --audit-level=high

  frontend-angular-ci:
    name: Frontend Angular Operations Portal Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        working-directory: frontend-angular
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: frontend-angular
        run: npm run lint

      - name: Build Angular production AOT bundle
        working-directory: frontend-angular
        run: npm run build

      - name: Dependency security audit
        working-directory: frontend-angular
        run: npm audit --audit-level=high
