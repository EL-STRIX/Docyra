name: Docyra CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run linter
        working-directory: backend
        run: npm run lint

      - name: Run test suites with MongoDB Memory Server
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/docyra_test
          JWT_ACCESS_SECRET: docyra_test_jwt_access_secret_key_12345
          JWT_REFRESH_SECRET: docyra_test_jwt_refresh_secret_key_12345
        run: npm test

  frontend-react-ci:
    name: Frontend React Patient App Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: frontend-react
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend-react
        run: npm run build

  frontend-angular-ci:
    name: Frontend Angular Operations Portal Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        working-directory: frontend-angular
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: frontend-angular
        run: npm run lint

      - name: Build Angular production AOT bundle
        working-directory: frontend-angular
        run: npm run build
