name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend-react, frontend-angular]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies (${{ matrix.app }})
        run: cd ${{ matrix.app }} && npm ci || npm install

      - name: Lint (${{ matrix.app }})
        run: cd ${{ matrix.app }} && npm run lint --if-present

      - name: Security audit (${{ matrix.app }})
        run: cd ${{ matrix.app }} && npm audit --audit-level=high || true
